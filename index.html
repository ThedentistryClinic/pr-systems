<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PR System - ระบบใบขอซื้อ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--pri:#c8102e;--bg:#f3f5f9;--bd:#d9dee8;--tx:#1f2937;--mut:#6b7280}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun','Tahoma',sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:#fff;border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header b{font-size:18px;color:var(--pri)} nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;color:var(--mut)}
nav button.on{background:#fde8ec;color:var(--pri);font-weight:600}
main{max-width:1100px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
h2{margin:0 0 14px;font-size:20px} h3{margin:16px 0 8px;font-size:16px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;width:100%;background:#fff}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{background:var(--pri);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--pri)} .btn.red{background:#dc2626}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk label{display:inline-flex;gap:5px;align-items:center;color:var(--tx);font-size:14px;margin-right:12px}
.chk input{width:auto}
table{width:100%;border-collapse:collapse} th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mut)} .tw{overflow-x:auto} tr.clk{cursor:pointer} tr.clk:hover{background:#f7f9fd}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.s0{background:#fef3c7;color:#92400e}.s1{background:#fee2e2;color:#991b1b}.s2{background:#dbeafe;color:#1e40af}
.s3{background:#d1fae5;color:#065f46}.s4{background:#ede9fe;color:#5b21b6}.s5{background:#bbf7d0;color:#14532d}.s6{background:#e5e7eb;color:#374151}
.kpi{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.kpi div{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px} .kpi b{display:block;font-size:26px;color:var(--pri)} .kpi span{color:var(--mut);font-size:13px}
.bar{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar div{background:#eef1f7;border-radius:6px;height:14px;overflow:hidden}.bar b{display:block;height:100%;background:var(--pri)} .bar em{font-style:normal;text-align:right}
.tl{display:flex;gap:4px;margin:10px 0 16px} .st{flex:1;text-align:center;font-size:12px;color:var(--mut);position:relative}
.st i{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 4px;border-radius:50%;background:#e5e7eb;font-style:normal;font-weight:700}
.st.done i{background:#16a34a;color:#fff}.st.cur i{background:var(--pri);color:#fff}.st.cur{color:var(--pri);font-weight:700}
.alert{padding:10px 12px;border-radius:8px;margin-bottom:10px;background:#fee2e2;color:#991b1b}
.modal{position:fixed;inset:0;background:#0007;display:none;overflow:auto;padding:20px;z-index:10}.modal.on{display:block}
.modal .box{background:#fff;max-width:820px;margin:0 auto;border-radius:12px;padding:20px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:99}
.login{max-width:440px;margin:6vh auto;padding:0 16px}
.lcard{background:#fff;border-radius:20px;padding:34px 30px;box-shadow:0 8px 30px #0001}
.brand{font-family:'Times New Roman',Georgia,serif;font-weight:700;font-size:34px;letter-spacing:1px;color:#c8102e;text-align:center}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:20px}
.tabs{display:flex;background:#f1f2f4;border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;color:#111}
.tabs button.on{background:#fff;box-shadow:0 1px 4px #0002}
.lcard label{font-size:14px;color:#111;margin:12px 0 5px}.lcard input{background:#e8eefc;border-color:#cdd6ea;padding:11px 12px}
.logo{display:block;width:210px;max-width:70%;margin:0 auto 4px}
.pf .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #c8102e;padding-bottom:6px;margin-bottom:8px}.pf .ph img{height:62px}.pf .ph div{text-align:right;font-weight:700;font-size:13px}.pf .ph span{font-weight:400}
.rq{color:#c8102e;font-style:normal}.btn.red2{width:100%;margin-top:18px;background:#c8102e;padding:12px;font-size:16px;border-radius:10px}
.mut{color:var(--mut)} .r{text-align:right}
/* ----- print ----- */
#printArea{display:none}
.pf{font-size:13px;color:#000;page-break-after:always} .pf:last-child{page-break-after:auto}
.pf h1{text-align:center;font-size:20px;margin:0 0 8px}
.pf table{border:1px solid #000;margin:6px 0} .pf th,.pf td{border:1px solid #000;padding:4px 6px;color:#000;font-size:13px}
.pf .meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}.pf .meta div{flex:1}
.pf .sig{display:flex;gap:30px;margin-top:30px;text-align:center}.pf .sig div{flex:1}.pf .sig .ln{border-bottom:1px dotted #000;height:42px}
@media print{body{background:#fff} body>*:not(#printArea){display:none!important} #printArea{display:block} @page{size:A4;margin:12mm}}
</style>
</head>

<div id="root"></div><div id="printArea"></div><div id="toast"></div>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const dt = d => d ? new Date(d).toLocaleDateString('en-GB') : '-';
const badge = s => `<span class="badge s${STATUS.indexOf(s)}">${esc(s)}</span>`;
const toEmail = u => u.includes('@') ? u : u + '@' + EMAIL_DOMAIN;
const ck = b => b ? '☑' : '☐';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
const isAdmin = () => me?.role === 'admin';

/* ===== Auth ===== */
async function boot(){
  if(!sb) return;
  const {data:{session}} = await sb.auth.getSession();
  session ? enter(session.user) : loginView();
}
function loginView(tab='in'){
  const reg = tab==='up';
  const fld = (l,n,t='text',x='') => `<label>${l} <i class="rq">*</i></label><input name="${n}" type="${t}" required ${x}>`;
  $('#root').innerHTML = `<div class="login"><div class="lcard"><img src="${LOGO}" alt="TANTATAT" class="logo"><div class="sub">ระบบใบขอซื้อ (PR)</div>
  <div class="tabs"><button type="button" class="${reg?'':'on'}" onclick="loginView('in')">เข้าสู่ระบบ</button><button type="button" class="${reg?'on':''}" onclick="loginView('up')">สมัครใช้งาน</button></div>
  <form id="lf">${reg
    ? fld('ชื่อ-นามสกุล','n')+fld('แผนก/สาขา','d')+`<label>ตำแหน่ง</label><input name="pos"><label>โทรศัพท์</label><input name="ph">`+fld('อีเมล','u','email')+fld('รหัสผ่าน (อย่างน้อย 6 ตัว)','p','password','minlength="6"')+fld('ยืนยันรหัสผ่าน','p2','password')
    : fld('อีเมล','u','text','autofocus')+fld('รหัสผ่าน','p','password')}
  <button class="btn red2">${reg?'สมัครใช้งาน':'เข้าสู่ระบบ'}</button></form></div></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    if(!reg){
      const {data,error} = await sb.auth.signInWithPassword({email:toEmail(f.u.value.trim()),password:f.p.value});
      if(error) return toast('เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง');
      return enter(data.user);
    }
    if(f.p.value!==f.p2.value) return toast('รหัสผ่านไม่ตรงกัน');
    const {data,error} = await sb.auth.signUp({email:toEmail(f.u.value.trim()),password:f.p.value,
      options:{data:{full_name:f.n.value.trim(),position:f.pos.value.trim(),phone:f.ph.value.trim(),dept:f.d.value.trim(),req_type:'general'}}});
    if(error) return toast('สมัครไม่สำเร็จ: '+error.message);
    if(data.session) return enter(data.user);
    toast('สมัครสำเร็จ กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ'); loginView('in');
  };
}
async function enter(u){
  const {data,error} = await sb.from('profiles').select('*').eq('id',u.id).single();
  if(error||!data){toast('ไม่พบข้อมูลผู้ใช้ในระบบ');await sb.auth.signOut();return loginView()}
  me = data; go(isAdmin() ? 'dash' : 'list');
}
async function logout(){await sb.auth.signOut();me=null;loginView()}

/* ===== Layout / routing ===== */
async function go(v, arg){
  view = v;
  const nav = isAdmin()
    ? [['dash','📊 Dashboard'],['list','รายการ PR ทั้งหมด'],['form','＋ สร้าง PR'],['users','👥 ผู้ใช้งาน']]
    : [['list','PR ของฉัน'],['form','＋ สร้าง PR']];
  $('#root').innerHTML = `<header><img src="${LOGO}" alt="TANTATAT" style="height:38px"><b style="font-size:15px">PR System</b><nav>${nav.map(n=>`<button class="${n[0]===v?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav>
    <span class="mut">${esc(me.full_name||me.username)} · ${isAdmin()?'IT/Admin':TYPE_TH[me.req_type]}</span>
    <button class="btn sec" onclick="logout()">ออกจากระบบ</button></header><main id="main">กำลังโหลด...</main>`;
  if(v==='form') return formView(arg);
  if(v==='users') return usersView();
  const {data,error} = await sb.from('purchase_requests').select('*').order('created_at',{ascending:false});
  if(error) return $('#main').innerHTML = `<div class="alert">${esc(error.message)}</div>`;
  prs = data;
  v==='dash' ? dashView() : listView();
}

/* ===== Dashboard (admin) ===== */
function dashView(){
  const c = s => prs.filter(p=>p.status===s).length;
  const sum = prs.filter(p=>p.status!=='ยกเลิก').reduce((a,p)=>a+Number(p.total),0);
  const group = (fn) => { const m={}; prs.forEach(p=>{const k=fn(p)||'-'; m[k]=(m[k]||0)+1}); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8) };
  const bars = (arr) => { const mx=Math.max(1,...arr.map(a=>a[1])); return arr.map(([l,v])=>`<div class="bar"><span>${esc(l)}</span><div><b style="width:${v/mx*100}%"></b></div><em>${v}</em></div>`).join('') || '<p class="mut">ไม่มีข้อมูล</p>' };
  const month = group(p=>new Date(p.created_at).toISOString().slice(0,7)).sort((a,b)=>a[0]<b[0]?-1:1);
  $('#main').innerHTML = `<div class="kpi">
    <div><b>${prs.length}</b><span>PR ทั้งหมด</span></div>
    <div><b>${c('รอตรวจสอบ')}</b><span>รอตรวจสอบ</span></div>
    <div><b>${c('รออนุมัติ')}</b><span>รออนุมัติ</span></div>
    <div><b>${c('ส่งกลับแก้ไข')}</b><span>ส่งกลับแก้ไข</span></div>
    <div><b>${c('เสร็จสิ้น')}</b><span>เสร็จสิ้น</span></div>
    <div><b style="font-size:20px;padding:6px 0">฿${fmt(sum)}</b><span>มูลค่ารวม (ไม่รวมยกเลิก)</span></div></div>
  <div class="g"><div class="card"><h3>แยกตามสถานะ</h3>${bars(STATUS.map(s=>[s,c(s)]))}</div>
  <div class="card"><h3>แยกตามแผนก/สาขา</h3>${bars(group(p=>p.dept))}</div>
  <div class="card"><h3>แยกตามความเร่งด่วน</h3>${bars(URG.map(u=>[u,prs.filter(p=>p.urgency===u).length]))}</div>
  <div class="card"><h3>รายเดือน</h3>${bars(month)}</div></div>
  <div class="card"><h2>PR ที่ต้องดำเนินการ</h2>${tableHtml(prs.filter(p=>['รอตรวจสอบ','รออนุมัติ','อนุมัติแล้ว','สั่งซื้อแล้ว'].includes(p.status)).slice(0,10))}</div>`;
}

/* ===== List ===== */
function tableHtml(rows){
  if(!rows.length) return '<p class="mut">ไม่มีรายการ</p>';
  return `<div class="tw"><table><tr><th>เลข PR</th><th>วันที่</th><th>ผู้ขอซื้อ</th><th>แผนก</th><th>ประเภท</th><th>เร่งด่วน</th><th class="r">ยอดรวม</th><th>สถานะ</th></tr>
  ${rows.map(p=>`<tr class="clk" onclick="detail('${p.id}')"><td><b>${esc(p.pr_no)}</b></td><td>${dt(p.created_at)}</td><td>${esc(p.req_name)}</td><td>${esc(p.dept)}</td><td>${p.type==='artwork'?'Artwork':'ทั่วไป'}</td><td>${esc(p.urgency)}</td><td class="r">${fmt(p.total)}</td><td>${badge(p.status)}</td></tr>`).join('')}</table></div>`;
}
function listView(){
  $('#main').innerHTML = `<div class="card"><h2>${isAdmin()?'รายการ PR ทั้งหมด':'PR ของฉัน'}</h2>
  <div class="row" style="margin-bottom:12px"><input id="q" placeholder="ค้นหา เลข PR / ชื่อ / แผนก / วัตถุประสงค์" style="max-width:340px">
  <select id="fs" style="max-width:180px"><option value="">ทุกสถานะ</option>${STATUS.map(s=>`<option>${s}</option>`).join('')}</select></div><div id="tbl"></div></div>`;
  const draw = () => { const q=$('#q').value.toLowerCase(), s=$('#fs').value;
    $('#tbl').innerHTML = tableHtml(prs.filter(p=>(!s||p.status===s)&&(!q||[p.pr_no,p.req_name,p.dept,p.purpose].join(' ').toLowerCase().includes(q)))) };
  $('#q').oninput = draw; $('#fs').onchange = draw; draw();
}

/* ===== Detail ===== */
function timeline(s){
  const i = FLOW.indexOf(s);
  return `<div class="tl">${FLOW.map((f,k)=>`<div class="st ${i>k?'done':i===k?'cur':''}"><i>${i>k?'✓':k+1}</i>${f}</div>`).join('')}</div>`
   + (s==='ส่งกลับแก้ไข'?'<div class="alert">PR ถูกส่งกลับให้แก้ไข กรุณาแก้ไขและส่งใหม่</div>':'') + (s==='ยกเลิก'?'<div class="alert">PR นี้ถูกยกเลิก</div>':'');
}
async function detail(id){
  const p = prs.find(x=>x.id===id);
  const {data:h} = await sb.from('pr_history').select('*').eq('pr_id',id).order('created_at',{ascending:true});
  const items = (p.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td class="r">${i.qty}</td><td>${esc(i.unit)}</td><td class="r">${fmt(i.price)}</td><td class="r">${fmt(i.qty*i.price)}</td><td>${dt(i.need)}</td></tr>`).join('');
  $('#mbox').innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(p.pr_no)} ${badge(p.status)}</h2><button class="btn sec" onclick="closeM()">ปิด</button></div>
  ${timeline(p.status)}
  <div class="g mut" style="font-size:14px"><div>ผู้ขอซื้อ: <b>${esc(p.req_name)}</b> (${esc(p.req_position)})</div><div>แผนก: <b>${esc(p.dept)}</b></div><div>โทร: ${esc(p.req_phone)}</div><div>ผู้ขาย: ${esc(p.vendor)||'-'}</div><div>เร่งด่วน: <b>${esc(p.urgency)}</b></div><div>วันที่: ${dt(p.created_at)}</div></div>
  <p><b>วัตถุประสงค์:</b> ${esc(p.purpose)}</p>
  <div class="tw"><table><tr><th>รายการ</th><th class="r">จำนวน</th><th>หน่วย</th><th class="r">ราคา/หน่วย</th><th class="r">รวม</th><th>ต้องการ</th></tr>${items}
  <tr><td colspan="4" class="r">รวมเป็นเงิน</td><td class="r">${fmt(p.subtotal)}</td><td></td></tr><tr><td colspan="4" class="r">VAT 7%</td><td class="r">${fmt(p.vat)}</td><td></td></tr>
  <tr><td colspan="4" class="r"><b>รวมทั้งหมด</b></td><td class="r"><b>${fmt(p.total)}</b></td><td></td></tr></table></div>
  <h3>ประวัติการดำเนินการ</h3>${(h||[]).map(x=>`<div style="padding:5px 0;border-bottom:1px solid var(--bd)">${badge(x.status)} <span class="mut">${new Date(x.created_at).toLocaleString('en-GB')} · ${esc(x.by_name)}</span> ${x.note?'— '+esc(x.note):''}</div>`).join('')}
  <div class="row" style="margin-top:16px"><button class="btn" onclick="printPR('${p.id}')">🖨 พิมพ์ใบ PR</button>
  ${p.status==='ส่งกลับแก้ไข'&&p.requester_id===me.id?`<button class="btn sec" onclick="closeM();go('form','${p.id}')">✏️ แก้ไขและส่งใหม่</button>`:''}</div>
  ${isAdmin()?`<div class="card" style="margin-top:16px;background:#f8fafc"><h3 style="margin-top:0">ปรับสถานะ (Admin)</h3>
  <div class="g"><div><label>สถานะ</label><select id="ns">${STATUS.map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></div>
  <div><label>หมายเหตุ (ผู้ขอซื้อจะเห็น)</label><input id="nn" placeholder="เช่น ข้อมูลไม่ครบ / ส่งอนุมัติแล้ว"></div></div>
  <button class="btn" style="margin-top:10px" onclick="setStatus('${p.id}')">บันทึกสถานะ</button></div>`:''}`;
  $('#modal').classList.add('on');
}
function closeM(){$('#modal').classList.remove('on')}
async function setStatus(id){
  const s=$('#ns').value, n=$('#nn').value.trim();
  const {error} = await sb.from('purchase_requests').update({status:s,updated_at:new Date().toISOString()}).eq('id',id);
  if(error) return toast(error.message);
  await sb.from('pr_history').insert({pr_id:id,status:s,note:n,by_name:me.full_name||me.username});
  toast('อัปเดตสถานะแล้ว'); closeM(); go(view);
}

/* ===== Form (สร้าง/แก้ไข PR) ===== */
function itemRow(i={}){
  return `<tr><td><input class="n" value="${esc(i.name)}"></td><td><input class="q" type="number" min="0" step="any" value="${i.qty??''}" style="width:80px"></td>
  <td><input class="u" value="${esc(i.unit)}" style="width:80px"></td><td><input class="p" type="number" min="0" step="any" value="${i.price??''}" style="width:100px"></td>
  <td class="r lt">0.00</td><td><input class="d" type="date" value="${i.need||''}"></td></tr>`;
}
async function formView(editId){
  let p = {items:[{},{},{}]}; 
  if(editId){ const {data} = await sb.from('purchase_requests').select('*').eq('id',editId).single(); p = data; }
  const art = p.artwork || {};
  const canPick = isAdmin() || me.req_type==='both';
  const type = p.type || (me.req_type==='artwork'?'artwork':'general');
  const radios = (name,arr,val) => arr.map(v=>`<label><input type="radio" name="${name}" value="${esc(v)}" ${v===val?'checked':''}>${esc(v)}</label>`).join('');
  $('#main').innerHTML = `<form id="f" class="card"><h2>${editId?'แก้ไข '+esc(p.pr_no):'ใบขอซื้อ/ใบขอจ้าง'}</h2>
  <div class="g">
   <div><label>ประเภทใบขอซื้อ</label>${canPick?`<select name="type" onchange="$('#art').style.display=this.value==='artwork'?'block':'none'"><option value="general" ${type==='general'?'selected':''}>ทั่วไป</option><option value="artwork" ${type==='artwork'?'selected':''}>Artwork / งานสั่งทำ</option></select>`:`<input name="type" type="hidden" value="${type}"><input value="${type==='artwork'?'Artwork / งานสั่งทำ':'ทั่วไป'}" disabled>`}</div>
   <div><label>แผนก/สาขา</label><input name="dept" value="${esc(p.dept??me.dept)}" required></div>
   <div><label>ผู้ขาย-ผู้ให้บริการ (ถ้าทราบ)</label><input name="vendor" value="${esc(p.vendor)}"></div></div>
  <div style="margin-top:12px"><label>วัตถุประสงค์การขอซื้อ/ขอจ้าง (จำเป็น)</label><textarea name="purpose" rows="2" required>${esc(p.purpose)}</textarea></div>
  <div class="g" style="margin-top:12px"><div><label>ผู้ขอซื้อ</label><input name="req_name" value="${esc(p.req_name??me.full_name)}" required></div>
   <div><label>โทรศัพท์</label><input name="req_phone" value="${esc(p.req_phone??me.phone)}"></div>
   <div><label>ตำแหน่ง</label><input name="req_position" value="${esc(p.req_position??me.position)}"></div></div>
  <div class="chk" style="margin-top:12px"><label style="display:inline">เคยสั่งจากร้านนี้หรือไม่:</label>
   <label><input type="radio" name="bought" value="1" ${p.bought_before===true?'checked':''}>เคย</label><label><input type="radio" name="bought" value="0" ${p.bought_before===false?'checked':''}>ไม่เคย</label></div>
  <h3>รายการสินค้า/สเปค</h3><div class="tw"><table><tr><th>รายการ/สเปค</th><th>จำนวน</th><th>หน่วย</th><th>ราคาต่อชิ้น</th><th class="r">ยอดรวม</th><th>วันที่ต้องการ</th></tr><tbody id="items">${(p.items.length?p.items:[{}]).map(itemRow).join('')}</tbody></table></div>
  <button type="button" class="btn sec" style="margin-top:8px" onclick="$('#items').insertAdjacentHTML('beforeend',itemRow())">＋ เพิ่มรายการ</button>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><label style="margin:0;color:var(--tx)"><input type="checkbox" name="vat" style="width:auto" ${Number(p.vat)>0?'checked':''}> คิด VAT 7%</label>
   <span>รวมเป็นเงิน <b id="sub">0.00</b> · VAT <b id="vt">0.00</b> · รวมทั้งหมด <b id="tot">0.00</b></span></div>
  <h3>ความเร่งด่วน</h3><div class="chk">${radios('urgency',URG,p.urgency||'ปกติ')}</div>
  <p class="mut" style="font-size:12px;margin:2px 0">ปกติ: ภายใน 14 วันทำการ · เร่งด่วน: ภายใน 7 วัน · ด่วนมาก: ภายใน 3 วัน (มีผลกระทบทันที)</p>
  <h3>Focus</h3><div class="chk">${radios('focus',FOCUS,p.focus)}</div>
  <div style="margin-top:12px"><label>หมายเหตุ/ผลกระทบ</label><textarea name="remark" rows="2">${esc(p.remark)}</textarea></div>
  <div id="art" style="display:${type==='artwork'?'block':'none'}"><h3>เอกสารแนบ: งานสั่งทำ / Artwork</h3>
   <label>ประเภท Artwork</label><div class="chk">${ATYPES.map(a=>`<label><input type="checkbox" name="atype" value="${a}" ${(art.types||[]).includes(a)?'checked':''}>${a}</label>`).join('')}</div>
   <div class="g" style="margin-top:8px">${ASSETS.map((a,i)=>`<div><label>${a}</label><div class="chk">${radios('as'+i,['มี','ไม่มี'],(art.assets||{})[a])}</div></div>`).join('')}</div>
   <div style="margin-top:8px"><label>ข้อความประชาสัมพันธ์</label><textarea name="atext" rows="2">${esc(art.text)}</textarea></div>
   <div style="margin-top:8px"><label>รายละเอียดงาน</label><textarea name="adetail" rows="3">${esc(art.detail)}</textarea></div>
   <div style="margin-top:8px"><label>ตัวอย่างงาน (ลิงก์/คำอธิบาย)</label><textarea name="aexample" rows="2">${esc(art.example)}</textarea></div></div>
  <div class="row" style="margin-top:18px"><button class="btn">${editId?'ส่งใหม่':'ส่งใบขอซื้อ'}</button><button type="button" class="btn sec" onclick="go('list')">ยกเลิก</button></div></form>`;
  const calc = () => { let s=0; document.querySelectorAll('#items tr').forEach(tr=>{const t=(+tr.querySelector('.q').value||0)*(+tr.querySelector('.p').value||0);tr.querySelector('.lt').textContent=fmt(t);s+=t});
    const v=$('#f').elements.vat.checked?s*0.07:0; $('#sub').textContent=fmt(s);$('#vt').textContent=fmt(v);$('#tot').textContent=fmt(s+v) };
  $('#f').addEventListener('input',calc); $('#f').elements.vat.onchange=calc; calc();
  $('#f').onsubmit = e => { e.preventDefault(); savePR(editId) };
}
async function savePR(editId){
  const f=$('#f'), g=n=>(f.elements[n]?.value||'').trim();
  const items=[...document.querySelectorAll('#items tr')].map(tr=>({name:tr.querySelector('.n').value.trim(),qty:+tr.querySelector('.q').value||0,unit:tr.querySelector('.u').value.trim(),price:+tr.querySelector('.p').value||0,need:tr.querySelector('.d').value})).filter(x=>x.name);
  if(!items.length) return toast('กรุณากรอกรายการอย่างน้อย 1 รายการ');
  const sub=items.reduce((s,x)=>s+x.qty*x.price,0), vat=f.elements.vat.checked?sub*0.07:0, type=g('type')||'general';
  const row={type,dept:g('dept'),vendor:g('vendor'),purpose:g('purpose'),req_name:g('req_name'),req_phone:g('req_phone'),req_position:g('req_position'),
    bought_before:f.elements.bought.value===''?null:f.elements.bought.value==='1',urgency:g('urgency')||'ปกติ',focus:g('focus'),remark:g('remark'),
    items,subtotal:sub,vat,total:sub+vat,
    artwork:type==='artwork'?{types:[...f.querySelectorAll('[name=atype]:checked')].map(x=>x.value),assets:Object.fromEntries(ASSETS.map((a,i)=>[a,f.elements['as'+i].value])),text:g('atext'),detail:g('adetail'),example:g('aexample')}:null};
  let r;
  if(editId){ r = await sb.from('purchase_requests').update({...row,status:'รอตรวจสอบ',updated_at:new Date().toISOString()}).eq('id',editId).select().single(); }
  else r = await sb.from('purchase_requests').insert(row).select().single();
  if(r.error) return toast(r.error.message);
  await sb.from('pr_history').insert({pr_id:r.data.id,status:'รอตรวจสอบ',note:editId?'แก้ไขและส่งใหม่':'ส่งใบขอซื้อ',by_name:me.full_name||me.username});
  toast('บันทึกแล้ว เลข PR: '+r.data.pr_no); go('list');
}

/* ===== Users (admin) ===== */
async function usersView(){
  const {data,error} = await sb.from('profiles').select('*').order('created_at');
  if(error) return $('#main').innerHTML=`<div class="alert">${esc(error.message)}</div>`;
  users = data;
  $('#main').innerHTML = `<div class="card"><h2>สร้างผู้ใช้งานใหม่</h2><form id="uf"><div class="g">
   <div><label>Username หรือ Email</label><input name="u" required></div><div><label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input name="p" type="password" minlength="6" required></div>
   <div><label>ชื่อ-นามสกุล</label><input name="n" required></div><div><label>ตำแหน่ง</label><input name="pos"></div>
   <div><label>โทรศัพท์</label><input name="ph"></div><div><label>แผนก/สาขา</label><input name="d"></div>
   <div><label>สิทธิ์</label><select name="role"><option value="user">User (ผู้ขอซื้อ)</option><option value="admin">IT/Admin</option></select></div>
   <div><label>ประเภทผู้ขอซื้อ</label><select name="rt"><option value="general">ทั่วไป</option><option value="artwork">Artwork/งานสั่งทำ</option><option value="both">ทั่วไป + Artwork</option></select></div></div>
   <button class="btn" style="margin-top:12px">สร้างผู้ใช้</button></form></div>
  <div class="card"><h2>รายชื่อผู้ใช้งาน</h2><div class="tw"><table><tr><th>Username</th><th>ชื่อ</th><th>แผนก</th><th>สิทธิ์</th><th>ประเภทผู้ขอซื้อ</th></tr>
  ${users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.full_name)}<br><span class="mut">${esc(u.position)}</span></td><td>${esc(u.dept)}</td>
  <td><select onchange="upd('${u.id}',{role:this.value})" ${u.id===me.id?'disabled':''}><option value="user" ${u.role==='user'?'selected':''}>User</option><option value="admin" ${u.role==='admin'?'selected':''}>IT/Admin</option></select></td>
  <td><select onchange="upd('${u.id}',{req_type:this.value})">${Object.entries(TYPE_TH).map(([k,v])=>`<option value="${k}" ${u.req_type===k?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</table></div></div>`;
  $('#uf').onsubmit = async e => {
    e.preventDefault(); const f=e.target;
    // client แยก เพื่อไม่ให้ session ของ admin ถูกแทนที่
    const tmp = supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    const {data,error} = await tmp.auth.signUp({email:toEmail(f.u.value.trim()),password:f.p.value,options:{data:{full_name:f.n.value,position:f.pos.value,phone:f.ph.value,dept:f.d.value,req_type:f.rt.value}}});
    if(error) return toast('สร้างไม่สำเร็จ: '+error.message);
    if(f.role.value==='admin' && data.user) await sb.from('profiles').update({role:'admin'}).eq('id',data.user.id);
    toast('สร้างผู้ใช้เรียบร้อย'); usersView();
  };
}
async function upd(id,patch){const {error}=await sb.from('profiles').update(patch).eq('id',id);toast(error?error.message:'บันทึกแล้ว')}

/* ===== Print ===== */

  const p = prs.find(x=>x.id===id), a = p.artwork;
  const {data:h} = await sb.from('pr_history').select('*').eq('pr_id',id);
  const phead = `<div class="ph"><img src="${LOGO}" alt="TANTATAT"><div>TANTATAT CLINIC COMPANY LIMITED<br><span>เลขที่ PR: ${esc(p.pr_no)}</span></div></div>`;
  const rows = [...(p.items||[])]; while(rows.length<12) rows.push({});
  const sig = (t,name,pos) => `<div><div class="ln"></div>(${esc(name)||'................................'})<br>${t}<br>ตำแหน่ง ${esc(pos)||'................'}<br>วันที่ ${dt(p.created_at)}</div>`;

  <div>วัตถุประสงค์การขอซื้อ/ขอจ้าง: ${esc(p.purpose)}</div>
  <div>ผู้ขอซื้อ: ${esc(p.req_name)} &nbsp; โทรศัพท์: ${esc(p.req_phone)} &nbsp; ตำแหน่ง: ${esc(p.req_position)}</div>
  <table><tr><th style="width:30px">#</th><th>รายการสินค้า/สเปค</th><th>จำนวน</th><th>หน่วย</th><th>ราคาต่อชิ้น</th><th>ยอดรวม</th><th>วันที่ต้องการ</th></tr>
  ${rows.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(i.name)}</td><td style="text-align:right">${i.name?i.qty:''}</td><td>${esc(i.unit)}</td><td style="text-align:right">${i.name?fmt(i.price):''}</td><td style="text-align:right">${i.name?fmt(i.qty*i.price):''}</td><td>${i.need?dt(i.need):''}</td></tr>`).join('')}
  <tr><td colspan="5" style="text-align:right">รวมเป็นเงิน</td><td style="text-align:right">${fmt(p.subtotal)}</td><td></td></tr>
  <tr><td colspan="5" style="text-align:right">ภาษีมูลค่าเพิ่ม 7%</td><td style="text-align:right">${fmt(p.vat)}</td><td></td></tr>
  <tr><td colspan="5" style="text-align:right"><b>รวมทั้งหมด</b></td><td style="text-align:right"><b>${fmt(p.total)}</b></td><td></td></tr></table>
  <div><b>Focus:</b> ${FOCUS.map(f=>`${ck(p.focus===f)} ${f}`).join(' &nbsp; ')}</div>
  <div><b>ความเร่งด่วน:</b> ${URG.slice().reverse().map(u=>`${ck(p.urgency===u)} ${u}`).join(' &nbsp; ')}</div>
  <div><b>หมายเหตุ/ผลกระทบ:</b> ${esc(p.remark)}</div>
  <div class="sig">${sig('ผู้ขอซื้อ',p.req_name,p.req_position)}${sig('ผู้ตรวจสอบ/ผู้อนุมัติ','','')}</div></div>
  ${a?`<div class="pf">${phead}<h1>เอกสารแนบ งานสั่งทำ (${esc(p.pr_no)})</h1>
  <div><b>ประเภท Artwork:</b> ${ATYPES.map(t=>`${ck((a.types||[]).includes(t))} ${t}`).join(' &nbsp; ')}</div>
  <table><tr><th>รายการ</th><th>มี</th><th>ไม่มี</th></tr>${ASSETS.map(s=>`<tr><td>${s}</td><td>${ck(a.assets?.[s]==='มี')}</td><td>${ck(a.assets?.[s]==='ไม่มี')}</td></tr>`).join('')}</table>
  <p><b>ข้อความประชาสัมพันธ์:</b> ${esc(a.text)}</p><p><b>รายละเอียดงาน:</b> ${esc(a.detail)}</p><p><b>ตัวอย่างงาน:</b> ${esc(a.example)}</p></div>`:''}`;
  window.print();
}

boot();
</script>
