<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PR System - ระบบใบขอซื้อ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--pri:#b3122b;--pri2:#8e0d21;--gold:#b8924a;--bg:#f7f4f1;--bd:#ebe4de;--tx:#26211f;--mut:#8a817b}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',Tahoma,sans-serif;color:var(--tx);font-size:15px;min-height:100vh;background-attachment:fixed;
 background:radial-gradient(1100px 520px at 92% -10%,#f6dcdf 0,transparent 60%),radial-gradient(900px 520px at -10% 112%,#f2e5d1 0,transparent 55%),var(--bg)}
header{background:#ffffffdb;backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:10px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5;box-shadow:0 2px 16px #3a1a1a0d}
header b{letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:600}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap;margin-left:10px}
nav button{background:none;border:0;padding:8px 16px;border-radius:99px;cursor:pointer;font:inherit;color:var(--mut);transition:.2s}
nav button:hover{background:#f3ece7;color:var(--tx)}
nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:600;box-shadow:0 4px 14px #b3122b44}
.chip{background:#f6efea;padding:6px 14px;border-radius:99px;font-size:13px}
main{max-width:1140px;margin:28px auto;padding:0 20px}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:0 6px 26px #3a1a1a0b}
h2{margin:0 0 16px;font:700 22px 'Noto Serif Thai','Sarabun',serif}
h3{margin:24px 0 10px;font:600 16px 'Noto Serif Thai','Sarabun',serif;color:var(--pri2);display:flex;align-items:center;gap:10px}
h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;width:100%;background:#fffdfc;transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px #b3122b1f}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;padding:10px 20px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;box-shadow:0 4px 14px #b3122b33;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px #b3122b44}
.btn.sec{background:#fff;color:var(--pri);border:1px solid #e3c4c8;box-shadow:none}.btn.sec:hover{background:#fff5f5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk label{display:inline-flex;gap:6px;align-items:center;color:var(--tx);font-size:14px;margin:0 14px 6px 0}
.chk input{width:auto;accent-color:var(--pri)}
table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid #f2ece7;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;background:#faf6f3;font-weight:600}
.tw{overflow-x:auto;border-radius:12px}tr.clk{cursor:pointer;transition:.15s}tr.clk:hover{background:#fdf6f4}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.s0{background:#fff4d6;color:#8a5a00}.s1{background:#fde4e4;color:#a11a1a}.s2{background:#e1ecff;color:#1e40af}
.s3{background:#d9f5e6;color:#0b6b3a}.s4{background:#eee4ff;color:#5b21b6}.s5{background:#c9f0d6;color:#14532d}.s6{background:#ebe8e6;color:#57514d}
.kpi{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:20px}
.kpi div{position:relative;overflow:hidden;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:18px 18px 16px 22px;box-shadow:0 6px 22px #3a1a1a0a}
.kpi div::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--pri),var(--gold))}
.kpi b{display:block;font:700 30px 'Noto Serif Thai',serif;color:var(--pri2)}.kpi span{color:var(--mut);font-size:13px}
.kpi i{position:absolute;right:14px;top:12px;font-style:normal;font-size:22px;opacity:.85}
.bar{display:grid;grid-template-columns:120px 1fr 36px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.bar div{background:#f3ece7;border-radius:8px;height:12px;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#dd6272);border-radius:8px}.bar em{font-style:normal;text-align:right;font-weight:600}
.tl{display:flex;margin:14px 0 20px}.st{flex:1;text-align:center;font-size:12px;color:var(--mut);position:relative}
.st::before{content:'';position:absolute;top:15px;left:-50%;width:100%;height:2px;background:#e8dfd9}.st:first-child::before{display:none}
.st.done::before,.st.cur::before{background:var(--pri)}
.st i{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;margin:0 auto 6px;border-radius:50%;background:#efe8e3;font-style:normal;font-weight:700}
.st.done i{background:var(--pri);color:#fff}.st.cur i{background:#fff;color:var(--pri);border:2px solid var(--pri);box-shadow:0 0 0 4px #b3122b22}
.st.cur{color:var(--pri);font-weight:700}
.alert{padding:12px 14px;border-radius:12px;margin-bottom:12px;background:#fde8e8;color:#9b1c1c;border:1px solid #f5c6c6}
.modal{position:fixed;inset:0;background:#1e0f1066;backdrop-filter:blur(4px);display:none;overflow:auto;padding:24px;z-index:10}.modal.on{display:block}
.modal .box{background:#fff;max-width:840px;margin:0 auto;border-radius:22px;padding:26px;box-shadow:0 30px 80px #0004}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a1d1d;color:#fff;padding:12px 22px;border-radius:12px;display:none;z-index:99;box-shadow:0 8px 24px #0003}
.mut{color:var(--mut)}.r{text-align:right}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:24px;border:2px dashed #dccfc6;border-radius:16px;background:#fffaf7;cursor:pointer;color:var(--tx);font-size:15px;transition:.15s}
.drop:hover{border-color:var(--pri);background:#fff3f2}.drop span{font-size:12px;color:var(--mut)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;margin-top:12px}
.th{position:relative;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:#fff;display:block;color:inherit;text-decoration:none}
.th img,.th .pdf{width:100%;height:100px;object-fit:cover;display:block}.th .pdf{display:grid;place-items:center;font-size:34px;background:#faf6f3}
.th span{display:block;font-size:11px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.th button{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:0;background:#000a;color:#fff;cursor:pointer;line-height:1}
/* login */
.login{max-width:470px;margin:6vh auto;padding:0 16px}
.lcard{background:#ffffffeb;backdrop-filter:blur(14px);border:1px solid #fff;border-radius:26px;padding:34px 32px 30px;box-shadow:0 24px 70px #6a1a2a24}
.logo{display:block;width:230px;max-width:70%;margin:0 auto 6px}
.sub{text-align:center;color:var(--gold);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:22px}
.tabs{display:flex;background:#f4eeea;border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:11px;border-radius:11px;font:inherit;font-weight:600;cursor:pointer;color:var(--mut);transition:.2s}
.tabs button.on{background:#fff;color:var(--tx);box-shadow:0 2px 8px #0002}
.lcard label{font-size:14px;color:var(--tx);margin:12px 0 5px}.lcard input{background:#f3f6ff;border-color:#d8e0f3;padding:12px 14px}
.rq{color:var(--pri);font-style:normal}.btn.red2{width:100%;margin-top:20px;padding:13px;font-size:16px;border-radius:12px}
/* print header */
.pf .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #b3122b;padding-bottom:6px;margin-bottom:8px}.pf .ph img{height:62px}.pf .ph div{text-align:right;font-weight:700;font-size:13px}.pf .ph span{font-weight:400}
.pimgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pimgs figure{margin:0;border:1px solid #000;padding:4px}.pimgs img{width:100%;max-height:230px;object-fit:contain}.pimgs figcaption{font-size:11px;text-align:center}
/* ----- print ----- */
#printArea{display:none}
.pf{font-size:13px;color:#000;page-break-after:always} .pf:last-child{page-break-after:auto}
.pf h1{text-align:center;font-size:20px;margin:0 0 8px}
.pf table{border:1px solid #000;margin:6px 0} .pf th,.pf td{border:1px solid #000;padding:4px 6px;color:#000;font-size:13px}
.pf .meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}.pf .meta div{flex:1}
.pf .sig{display:flex;gap:30px;margin-top:30px;text-align:center}.pf .sig div{flex:1}.pf .sig .ln{border-bottom:1px dotted #000;height:42px}
@media print{body{background:#fff} body>*:not(#printArea){display:none!important} #printArea{display:block} @page{size:A4;margin:12mm}}
</style>
</head>

function fatal(m){document.getElementById('root').innerHTML='<div class="card login"><h2>⚠️ เกิดข้อผิดพลาด</h2><div class="alert">'+String(m).replace(/</g,'&lt;')+'</div></div>'}
window.addEventListener('error',e=>fatal(e.message));
window.addEventListener('unhandledrejection',e=>fatal(e.reason?.message||e.reason));
let sb;
try{
  if(!window.supabase) throw new Error('โหลดไลบรารี Supabase ไม่ได้ (ตรวจสอบอินเทอร์เน็ต หรือไฟร์วอลล์ที่บล็อก cdn.jsdelivr.net)');
  if(SUPABASE_URL.includes('YOUR-PROJECT')||SUPABASE_KEY.includes('YOUR-ANON')) throw new Error('ยังไม่ได้ใส่ SUPABASE_URL และ SUPABASE_KEY ที่ต้นสคริปต์ใน index.html');
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}catch(e){ fatal(e.message) }
const STATUS = ['รอตรวจสอบ','ส่งกลับแก้ไข','รออนุมัติ','อนุมัติแล้ว','สั่งซื้อแล้ว','เสร็จสิ้น','ยกเลิก'];
const FLOW = ['รอตรวจสอบ','รออนุมัติ','อนุมัติแล้ว','สั่งซื้อแล้ว','เสร็จสิ้น'];
const URG = ['ปกติ','เร่งด่วน','ด่วนมาก'];
const FOCUS = ['ราคาถูกเป็นหลัก เพิ่ม Volume ได้','ตามจำนวน ราคาเป็นรอง','สินค้าทดลอง สั่งน้อย ราคาเพิ่มไม่เกิน 10% จากราคา Standard','ได้เร็วสุด ราคาเพิ่มไม่เกิน 10% จากราคา Standard','ตรงสเปคเท่านั้น ราคาเป็นรอง'];
const ATYPES = ['Banner','Poster','Sticker','Video','Roll-up','Social Media','Packaging','อื่นๆ'];
const ASSETS = ['ตัวอย่าง Artwork','Logo','Brand Guideline','รูปภาพประกอบ'];
const TYPE_TH = {general:'ทั่วไป',artwork:'Artwork/งานสั่งทำ',both:'ทั่วไป + Artwork'};

let me = null, view = 'list', prs = [], users = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const dt = d => d ? new Date(d).toLocaleDateString('en-GB') : '-';
const badge = s => `<span class="badge s${STATUS.indexOf(s)}">${esc(s)}</span>`;
const toEmail = u => u.includes('@') ? u : u + '@' + EMAIL_DOMAIN;
const ck = b => b ? '☑' : '☐';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
const isAdmin = () => me?.role === 'admin';

/* ===== Auth ===== */
async function boot(){
  if(!sb) return;
  const {data:{session}} = await sb.auth.getSession();
  session ? enter(session.user) : loginView();
}
function loginView(tab='in'){
  const reg = tab==='up';
  const fld = (l,n,t='text',x='') => `<label>${l} <i class="rq">*</i></label><input name="${n}" type="${t}" required ${x}>`;
  $('#root').innerHTML = `<div class="login"><div class="lcard"><img src="${LOGO}" alt="TANTATAT" class="logo"><div class="sub">ระบบใบขอซื้อ (PR)</div>
  <div class="tabs"><button type="button" class="${reg?'':'on'}" onclick="loginView('in')">เข้าสู่ระบบ</button><button type="button" class="${reg?'on':''}" onclick="loginView('up')">สมัครใช้งาน</button></div>
  <form id="lf">${reg
    ? fld('ชื่อ-นามสกุล','n')+fld('แผนก/สาขา','d')+`<label>ตำแหน่ง</label><input name="pos"><label>โทรศัพท์</label><input name="ph">`+fld('อีเมล','u','email')+fld('รหัสผ่าน (อย่างน้อย 6 ตัว)','p','password','minlength="6"')+fld('ยืนยันรหัสผ่าน','p2','password')
    : fld('อีเมล','u','text','autofocus')+fld('รหัสผ่าน','p','password')}
  <button class="btn red2">${reg?'สมัครใช้งาน':'เข้าสู่ระบบ'}</button></form></div></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    if(!reg){
      const {data,error} = await sb.auth.signInWithPassword({email:toEmail(f.u.value.trim()),password:f.p.value});
      if(error) return toast('เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง');
      return enter(data.user);
    }
    if(f.p.value!==f.p2.value) return toast('รหัสผ่านไม่ตรงกัน');
    const {data,error} = await sb.auth.signUp({email:toEmail(f.u.value.trim()),password:f.p.value,
      options:{data:{full_name:f.n.value.trim(),position:f.pos.value.trim(),phone:f.ph.value.trim(),dept:f.d.value.trim(),req_type:'general'}}});
    if(error) return toast('สมัครไม่สำเร็จ: '+error.message);
    if(data.session) return enter(data.user);
    toast('สมัครสำเร็จ กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ'); loginView('in');
  };
}
async function enter(u){
  const {data,error} = await sb.from('profiles').select('*').eq('id',u.id).single();
  if(error||!data){toast('ไม่พบข้อมูลผู้ใช้ในระบบ');await sb.auth.signOut();return loginView()}
  me = data; go(isAdmin() ? 'dash' : 'list');
}
async function logout(){await sb.auth.signOut();me=null;loginView()}

/* ===== Layout / routing ===== */
async function go(v, arg){
  view = v;
  const nav = isAdmin()
    ? [['dash','📊 Dashboard'],['list','รายการ PR ทั้งหมด'],['form','＋ สร้าง PR'],['users','👥 ผู้ใช้งาน']]
    : [['list','PR ของฉัน'],['form','＋ สร้าง PR']];
  $('#root').innerHTML = `<header><img src="${LOGO}" alt="TANTATAT" style="height:38px"><b style="font-size:15px">PR System</b><nav>${nav.map(n=>`<button class="${n[0]===v?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav>
    <span class="chip">${esc(me.full_name||me.username)} · ${isAdmin()?'IT/Admin':TYPE_TH[me.req_type]}</span>
    <button class="btn sec" onclick="logout()">ออกจากระบบ</button></header><main id="main">กำลังโหลด...</main>`;
  if(v==='form') return formView(arg);
  if(v==='users') return usersView();
  const {data,error} = await sb.from('purchase_requests').select('*').order('created_at',{ascending:false});
  if(error) return $('#main').innerHTML = `<div class="alert">${esc(error.message)}</div>`;
  prs = data;
  v==='dash' ? dashView() : listView();
}

/* ===== Dashboard (admin) ===== */
function dashView(){
  const c = s => prs.filter(p=>p.status===s).length;
  const sum = prs.filter(p=>p.status!=='ยกเลิก').reduce((a,p)=>a+Number(p.total),0);
  const group = (fn) => { const m={}; prs.forEach(p=>{const k=fn(p)||'-'; m[k]=(m[k]||0)+1}); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8) };
  const bars = (arr) => { const mx=Math.max(1,...arr.map(a=>a[1])); return arr.map(([l,v])=>`<div class="bar"><span>${esc(l)}</span><div><b style="width:${v/mx*100}%"></b></div><em>${v}</em></div>`).join('') || '<p class="mut">ไม่มีข้อมูล</p>' };
  const month = group(p=>new Date(p.created_at).toISOString().slice(0,7)).sort((a,b)=>a[0]<b[0]?-1:1);
  $('#main').innerHTML = `<div class="kpi">
    <div><i>📋</i><b>${prs.length}</b><span>PR ทั้งหมด</span></div>
    <div><i>🔍</i><b>${c('รอตรวจสอบ')}</b><span>รอตรวจสอบ</span></div>
    <div><i>⏳</i><b>${c('รออนุมัติ')}</b><span>รออนุมัติ</span></div>
    <div><i>↩️</i><b>${c('ส่งกลับแก้ไข')}</b><span>ส่งกลับแก้ไข</span></div>
    <div><i>✅</i><b>${c('เสร็จสิ้น')}</b><span>เสร็จสิ้น</span></div>
    <div><i>💰</i><b style="font-size:20px;padding:6px 0">฿${fmt(sum)}</b><span>มูลค่ารวม (ไม่รวมยกเลิก)</span></div></div>
  <div class="g"><div class="card"><h3>แยกตามสถานะ</h3>${bars(STATUS.map(s=>[s,c(s)]))}</div>
  <div class="card"><h3>แยกตามแผนก/สาขา</h3>${bars(group(p=>p.dept))}</div>
  <div class="card"><h3>แยกตามความเร่งด่วน</h3>${bars(URG.map(u=>[u,prs.filter(p=>p.urgency===u).length]))}</div>
  <div class="card"><h3>รายเดือน</h3>${bars(month)}</div></div>
  <div class="card"><h2>PR ที่ต้องดำเนินการ</h2>${tableHtml(prs.filter(p=>['รอตรวจสอบ','รออนุมัติ','อนุมัติแล้ว','สั่งซื้อแล้ว'].includes(p.status)).slice(0,10))}</div>`;
}

/* ===== List ===== */
function tableHtml(rows){

/* ===== ไฟล์แนบ (Supabase Storage) ===== */
const BUCKET='pr-attachments'; let curAtt=[], newFiles=[];
async function signMap(paths){ const {data}=await sb.storage.from(BUCKET).createSignedUrls(paths,3600); const m={}; (data||[]).forEach(d=>m[d.path]=d.signedUrl); return m }
async function drawAtt(){
  const um = curAtt.length ? await signMap(curAtt.map(a=>a.path)) : {};
  const x = (i,k) => `<button type="button" onclick="${k}.splice(${i},1);drawAtt()">×</button>`;
  $('#thumbs').innerHTML = curAtt.map((a,i)=>`<div class="th">${(a.type||'').startsWith('image/')?`<img src="${um[a.path]||''}">`:'<div class="pdf">📄</div>'}${x(i,'curAtt')}<span>${esc(a.name)}</span></div>`).join('')
   + newFiles.map((f,i)=>`<div class="th">${f.type.startsWith('image/')?`<img src="${URL.createObjectURL(f)}">`:'<div class="pdf">📄</div>'}${x(i,'newFiles')}<span>${esc(f.name)}</span></div>`).join('');
}
async function shrink(f){
  if(!f.type.startsWith('image/')||f.type==='image/gif') return f;
  const bmp=await createImageBitmap(f), k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
}
async function uploadFiles(files){
  const out=[];
  for(const f of files){
    const blob=await shrink(f), ext=blob.type==='image/jpeg'?'jpg':(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path=`${me.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type});
    if(error) throw error; out.push({name:f.name,path,type:blob.type});
  }
  return out;
}
async function savePR(editId){
  const f=$('#f'), g=n=>(f.elements[n]?.value||'').trim();
  const items=[...document.querySelectorAll('#items tr')].map(tr=>({name:tr.querySelector('.n').value.trim(),qty:+tr.querySelector('.q').value||0,unit:tr.querySelector('.u').value.trim(),price:+tr.querySelector('.p').value||0,need:tr.querySelector('.d').value})).filter(x=>x.name);
  if(!items.length) return toast('กรุณากรอกรายการอย่างน้อย 1 รายการ');
  const sub=items.reduce((s,x)=>s+x.qty*x.price,0), vat=f.elements.vat.checked?sub*0.07:0, type=g('type')||'general';
  const row={type,dept:g('dept'),vendor:g('vendor'),purpose:g('purpose'),req_name:g('req_name'),req_phone:g('req_phone'),req_position:g('req_position'),
    bought_before:f.elements.bought.value===''?null:f.elements.bought.value==='1',urgency:g('urgency')||'ปกติ',focus:g('focus'),remark:g('remark'),
    items,subtotal:sub,vat,total:sub+vat,
    artwork:type==='artwork'?{types:[...f.querySelectorAll('[name=atype]:checked')].map(x=>x.value),assets:Object.fromEntries(ASSETS.map((a,i)=>[a,f.elements['as'+i].value])),text:g('atext'),detail:g('adetail'),example:g('aexample')}:null};
  let atts=[...curAtt];
  try{ if(newFiles.length){ toast('กำลังอัปโหลดไฟล์...'); atts=atts.concat(await uploadFiles(newFiles)); } }catch(e){ return toast('อัปโหลดไฟล์ไม่สำเร็จ: '+e.message) }
  row.attachments=atts;
  let r;
  if(editId){ r = await sb.from('purchase_requests').update({...row,status:'รอตรวจสอบ',updated_at:new Date().toISOString()}).eq('id',editId).select().single(); }
  else r = await sb.from('purchase_requests').insert(row).select().single();
  if(r.error) return toast(r.error.message);
  await sb.from('pr_history').insert({pr_id:r.data.id,status:'รอตรวจสอบ',note:editId?'แก้ไขและส่งใหม่':'ส่งใบขอซื้อ',by_name:me.full_name||me.username});
  toast('บันทึกแล้ว เลข PR: '+r.data.pr_no); go('list');
}

/* ===== Print ===== */
async function printPR(id){
  const p = prs.find(x=>x.id===id), a = p.artwork;
  const {data:h} = await sb.from('pr_history').select('*').eq('pr_id',id);
  const phead = `<div class="ph"><img src="${LOGO}" alt="TANTATAT"><div>TANTATAT CLINIC COMPANY LIMITED<br><span>เลขที่ PR: ${esc(p.pr_no)}</span></div></div>`;
  const rows = [...(p.items||[])]; while(rows.length<12) rows.push({});
  const sig = (t,name,pos) => `<div><div class="ln"></div>(${esc(name)||'................................'})<br>${t}<br>ตำแหน่ง ${esc(pos)||'................'}<br>วันที่ ${dt(p.created_at)}</div>`;
  $('#printArea').innerHTML = `<div class="pf">${phead}<h1>ใบขอซื้อ/ใบขอจ้าง</h1>
  <div class="meta"><div>เลขที่ PR: <b>${esc(p.pr_no)}</b></div><div>วันที่: ${dt(p.created_at)}</div><div>แผนก/สาขา: ${esc(p.dept)}</div></div>
  <div>ผู้ขาย-ผู้ให้บริการ: ${esc(p.vendor)||'-'} &nbsp;&nbsp; เคยสั่งจากร้านนี้หรือไม่: ${ck(p.bought_before===true)} เคย ${ck(p.bought_before===false)} ไม่เคย</div>
  <div>วัตถุประสงค์การขอซื้อ/ขอจ้าง: ${esc(p.purpose)}</div>
  <div>ผู้ขอซื้อ: ${esc(p.req_name)} &nbsp; โทรศัพท์: ${esc(p.req_phone)} &nbsp; ตำแหน่ง: ${esc(p.req_position)}</div>
  <table><tr><th style="width:30px">#</th><th>รายการสินค้า/สเปค</th><th>จำนวน</th><th>หน่วย</th><th>ราคาต่อชิ้น</th><th>ยอดรวม</th><th>วันที่ต้องการ</th></tr>
  ${rows.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(i.name)}</td><td style="text-align:right">${i.name?i.qty:''}</td><td>${esc(i.unit)}</td><td style="text-align:right">${i.name?fmt(i.price):''}</td><td style="text-align:right">${i.name?fmt(i.qty*i.price):''}</td><td>${i.need?dt(i.need):''}</td></tr>`).join('')}
  <tr><td colspan="5" style="text-align:right">รวมเป็นเงิน</td><td style="text-align:right">${fmt(p.subtotal)}</td><td></td></tr>
  <tr><td colspan="5" style="text-align:right">ภาษีมูลค่าเพิ่ม 7%</td><td style="text-align:right">${fmt(p.vat)}</td><td></td></tr>
  <tr><td colspan="5" style="text-align:right"><b>รวมทั้งหมด</b></td><td style="text-align:right"><b>${fmt(p.total)}</b></td><td></td></tr></table>
  <div><b>Focus:</b> ${FOCUS.map(f=>`${ck(p.focus===f)} ${f}`).join(' &nbsp; ')}</div>
  <div><b>ความเร่งด่วน:</b> ${URG.slice().reverse().map(u=>`${ck(p.urgency===u)} ${u}`).join(' &nbsp; ')}</div>
  <div><b>หมายเหตุ/ผลกระทบ:</b> ${esc(p.remark)}</div>
  <div class="sig">${sig('ผู้ขอซื้อ',p.req_name,p.req_position)}${sig('ผู้ตรวจสอบ/ผู้อนุมัติ','','')}</div></div>
  ${a?`<div class="pf">${phead}<h1>เอกสารแนบ งานสั่งทำ (${esc(p.pr_no)})</h1>
  <div><b>ประเภท Artwork:</b> ${ATYPES.map(t=>`${ck((a.types||[]).includes(t))} ${t}`).join(' &nbsp; ')}</div>
  <table><tr><th>รายการ</th><th>มี</th><th>ไม่มี</th></tr>${ASSETS.map(s=>`<tr><td>${s}</td><td>${ck(a.assets?.[s]==='มี')}</td><td>${ck(a.assets?.[s]==='ไม่มี')}</td></tr>`).join('')}</table>
  <p><b>ข้อความประชาสัมพันธ์:</b> ${esc(a.text)}</p><p><b>รายละเอียดงาน:</b> ${esc(a.detail)}</p><p><b>ตัวอย่างงาน:</b> ${esc(a.example)}</p></div>`:''}`;
  const imgs=(p.attachments||[]).filter(a=>(a.type||'').startsWith('image/'));
  if(imgs.length){
    const um=await signMap(imgs.map(a=>a.path));
    $('#printArea').insertAdjacentHTML('beforeend',`<div class="pf">${phead}<h1>รูปประกอบ (${esc(p.pr_no)})</h1><div class="pimgs">${imgs.map(a=>`<figure><img src="${um[a.path]}"><figcaption>${esc(a.name)}</figcaption></figure>`).join('')}</div></div>`);
    await Promise.all([...$('#printArea').querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
  }
  window.print();
}

boot();
</script>
